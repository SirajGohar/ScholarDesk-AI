      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    @media print {
      body { background: white !important; overflow: visible !important; }
      .no-print { display: none !important; }
      .slide-canvas { max-width: 100% !important; max-height: 100% !important; box-shadow: none !important; border-radius: 0 !important; page-break-after: always; margin-bottom: 2rem; }

</head>

    let currentSlide = 0;
    const container = document.getElementById('slide-container');
    const indicator = document.getElementById('slide-indicator');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    function renderSlide(idx) {
      if (idx < 0) idx = 0;
      if (idx >= SLIDES.length) idx = SLIDES.length - 1;
      currentSlide = idx;
      container.innerHTML = SLIDES[currentSlide].render();
      indicator.textContent = `${currentSlide + 1} / ${SLIDES.length}`;
      prevBtn.disabled = currentSlide === 0;
      nextBtn.disabled = currentSlide === SLIDES.length - 1;
    }

    prevBtn.addEventListener('click', () => renderSlide(currentSlide - 1));
    nextBtn.addEventListener('click', () => renderSlide(currentSlide + 1));

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        renderSlide(currentSlide + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        renderSlide(currentSlide - 1);
      }
    });

    renderSlide(0);
  </script>

</html>
